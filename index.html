<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vendo: book function rooms, village halls, private bars and leisure centres for weddings, parties and events.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5DA9E9">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vendo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Nunito:wght@400;500;600;700;800&family=Manrope:wght@800&display=swap">
<style>
/* Layout: marketplace app — sticky bar, search strip, venue grid; host view is a two-column dashboard. */
:root{
  --bg:#F6F1E6; --surface:#FFFFFF; --sunk:#EEE6D4; --ink:#17324D; --muted:#5E7187; --line:#E2D8C3;
  --accent:#5DA9E9; --accent-text:#2B74B3; --accent-soft:#E3F0FB; --on-accent:#0F2338; --brass:#C29A4E;
  --logo-pin:#5DA9E9; --logo-door:#E2C98F; --map-sea:#D6E8F6; --map-land:#FBF8F1; --map-coast:#CDBB8E; --good:#2D7650; --good-soft:#E0F0E6; --warn:#A35A12;
  --scrim:rgba(14,20,18,.55); --shadow:0 1px 2px rgba(22,32,30,.06),0 8px 28px rgba(22,32,30,.08);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
/* Event moods: picking an occasion re-colours the app. Wedding = black primary, white secondary. */
:root[data-mood="wedding"]{--bg:#F6F6F4;--surface:#FFFFFF;--sunk:#ECECEA;--ink:#0D0D0D;--muted:#5E5E5E;--line:#DADAD8;--accent:#0D0D0D;--accent-text:#0D0D0D;--accent-soft:#EFEFEF;--on-accent:#FFFFFF;--brass:#8C8C8C}
:root[data-mood="birthday"]{--bg:#FBF3F6;--sunk:#F6E4EB;--line:#EBD3DC;--accent:#D12F6A;--accent-text:#D12F6A;--accent-soft:#FCE1EB;--on-accent:#FFFFFF;--brass:#D99A00}
:root[data-mood="wake"]{--bg:#EDEFF2;--sunk:#E1E5EA;--line:#D2D8E0;--accent:#3D4A60;--accent-text:#3D4A60;--accent-soft:#E2E6EE;--on-accent:#FFFFFF;--brass:#7D8798}
:root[data-mood="christening"]{--bg:#F1F5FA;--sunk:#E2EBF5;--line:#D3DFEC;--accent:#3F74AE;--accent-text:#3F74AE;--accent-soft:#E1ECF8;--on-accent:#FFFFFF;--brass:#B89B5E}
:root[data-mood="corporate"]{--bg:#EEF1F5;--sunk:#E1E6EE;--line:#D1D8E2;--accent:#1D3557;--accent-text:#1D3557;--accent-soft:#E0E7F1;--on-accent:#FFFFFF;--brass:#8B929C}
:root[data-mood="clubs"]{--bg:#EDF3EF;--sunk:#DEEAE2;--line:#CFDFD4;--accent:#28724A;--accent-text:#28724A;--accent-soft:#DDEFE4;--on-accent:#FFFFFF;--brass:#B08A2E}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212D; --sunk:#111A24; --ink:#EEF2F5; --muted:#9AAABA; --line:#263444;
  --accent:#7DBDF0; --accent-text:#8CC6F2; --accent-soft:#1A2D40; --on-accent:#0B1B2B; --brass:#E2C98F; --good:#72C495; --good-soft:#17301F; --warn:#E3A35E; --map-sea:#0F2130; --map-land:#1A2633; --map-coast:#33475C;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
/* Dark palettes apply only when the viewer explicitly chooses dark. */
:root[data-theme="dark"][data-mood="wedding"]{--bg:#0A0A0A;--surface:#151515;--sunk:#0F0F0F;--ink:#F5F5F3;--muted:#9C9C9C;--line:#2B2B2B;--accent:#F5F5F3;--accent-text:#F5F5F3;--accent-soft:#242424;--on-accent:#0A0A0A;--brass:#BDBDBD}
:root[data-theme="dark"][data-mood="birthday"]{--bg:#140C10;--surface:#20141A;--sunk:#180E13;--line:#36222C;--accent:#FF77A6;--accent-text:#FF77A6;--accent-soft:#3A1625;--on-accent:#1E0A12;--brass:#F2C14E}
:root[data-theme="dark"][data-mood="wake"]{--bg:#0F1217;--surface:#181D25;--sunk:#12161C;--line:#29303B;--accent:#AAB6CB;--accent-text:#AAB6CB;--accent-soft:#1F2633;--on-accent:#10141B;--brass:#8F98A8}
:root[data-theme="dark"][data-mood="christening"]{--bg:#0D131B;--surface:#162130;--sunk:#101824;--line:#243347;--accent:#9DC3EA;--accent-text:#9DC3EA;--accent-soft:#1A2A3B;--on-accent:#0B1521;--brass:#D3B97E}
:root[data-theme="dark"][data-mood="corporate"]{--bg:#0D1118;--surface:#161D29;--sunk:#10151E;--line:#253042;--accent:#8EAFD8;--accent-text:#8EAFD8;--accent-soft:#19263A;--on-accent:#0B1220;--brass:#A3AAB4}
:root[data-theme="dark"][data-mood="clubs"]{--bg:#0D1410;--surface:#16211B;--sunk:#101914;--line:#243529;--accent:#7CCB9A;--accent-text:#7CCB9A;--accent-soft:#163021;--on-accent:#0A1A10;--brass:#D6B262}

*{box-sizing:border-box}
[hidden]{display:none!important}
body,.top,.search,.chip,.go,.cta,.btn,.field,.book,.panel,.kpis,.addon{transition:background-color .45s ease,color .45s ease,border-color .45s ease}
@media (prefers-reduced-motion:reduce){body,.top,.search,.chip,.go,.cta,.btn,.field,.book,.panel,.kpis,.addon{transition:none}}
.mood-note{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.mood-note i{display:inline-flex;width:34px;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.mood-note i::before,.mood-note i::after{content:"";flex:1}
.mood-note i::before{background:var(--accent)}
.mood-note i::after{background:var(--accent-soft)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variation-settings:"SOFT" 100}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{font-family:var(--f-display);font-style:normal;font-size:27px;font-weight:500;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;text-decoration:none;color:var(--ink)}
.logo svg{display:block;height:42px;width:auto}
@media (max-width:640px){.logo svg{height:32px}.top .wrap{gap:10px}}
.logo .lp{fill:var(--logo-pin)} .logo .lc{fill:var(--surface)} .logo .li{fill:var(--ink)} .logo .ld{fill:var(--logo-door)}
.switch{margin-left:auto;display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.demo-tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap}
@media (max-width:640px){.demo-tag{display:none}.switch button{padding:7px 10px;font-size:13px}}

/* Hero / search */
.intro{padding-block:40px 22px;display:grid;gap:22px}
.intro h1{font-size:clamp(34px,5.2vw,58px);line-height:1.04;max-width:16ch}
.intro h1 em{color:var(--accent-text)}
.intro p{color:var(--muted);max-width:58ch;margin:0;font-size:16.5px}
.search{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr 1fr 0.8fr auto;gap:0;overflow:hidden}
.field{padding:12px 18px;border-right:1px solid var(--line);display:grid;gap:2px;min-width:0}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:0;background:none;padding:2px 0;outline:none;font-weight:600;font-size:15px;min-width:0;width:100%}
.search .go{border:0;margin:8px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 24px}
@media (max-width:760px){.search{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1;border-right:0}.field:nth-child(-n+3){border-bottom:1px solid var(--line)}.field:nth-child(3){border-right:0}.field:nth-child(4){grid-column:1/-1;border-right:0}.search .go{grid-column:1/-1;padding:12px}}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.resultbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 14px}
.resultbar .count{font-weight:600}
.resultbar select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-weight:600;font-size:13.5px}

/* Venue grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:26px 22px;padding-bottom:56px}
.card{display:grid;gap:10px;text-align:left;border:0;background:none;padding:0;color:inherit}
.card .pic{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--sunk);transition:transform .35s ease}
.card:hover .pic{transform:translateY(-3px)}
.pic svg{display:block;width:100%;height:100%}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);color:#16201E;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;display:flex;gap:6px;align-items:center}
.badge.instant::before{content:"";width:7px;height:7px;border-radius:50%;background:#2D7650}
.kind{position:absolute;bottom:10px;left:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#17324D;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);padding:4px 8px;border-radius:6px}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h3{font-size:20px;line-height:1.2}
.rating{font-size:13.5px;font-weight:600;white-space:nowrap}
.rating::before{content:"★ ";color:var(--brass)}
.card .where{color:var(--muted);font-size:13.5px;margin-top:-6px}
.card .meta{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.card .meta b{color:var(--ink);font-weight:700}
.price{font-size:14.5px}
.price b{font-size:16px}
.empty{grid-column:1/-1;padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Detail sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border-radius:20px;width:min(1080px,100%);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s ease}
@keyframes rise{from{transform:translateY(16px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card .pic{transition:none}}
.sheet .hero{position:relative;aspect-ratio:21/8;max-width:100%}
.sheet .hero svg{width:100%;height:100%;display:block}
.close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#16201E;font-size:20px;line-height:1}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:32px;padding:28px 32px 32px}
@media (max-width:880px){.sheet-body{grid-template-columns:1fr;padding:22px 18px}.sheet .hero{aspect-ratio:16/9}}
.vhead{display:grid;gap:6px}
.vhead h2{font-size:clamp(28px,4vw,40px);line-height:1.08}
.vhead .sub{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-block:22px}
.facts div{padding:12px 14px;border-right:1px solid var(--line);display:grid;gap:2px}
.facts div:last-child{border-right:0}
.facts b{font-size:19px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(2){border-right:0}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.section{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.section h3{font-size:21px}
.blurb{margin:0;max-width:62ch}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;list-style:none;padding:0;margin:0}
.features li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px}
.features li::before{content:"";flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--good-soft);box-shadow:inset 0 0 0 4.5px var(--good-soft),inset 0 0 0 9px var(--good)}
.suits{display:flex;gap:6px;flex-wrap:wrap}
.suits span{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.host{display:flex;gap:14px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-family:var(--f-display);font-size:19px;font-weight:600}
.rules{font-size:14px;color:var(--muted);margin:0;padding-left:18px}

/* Booking panel */
.book{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:grid;gap:16px;align-self:start;position:sticky;top:16px}
.book .from{display:flex;justify-content:space-between;align-items:baseline}
.book .from b{font-family:var(--f-display);font-size:28px;font-weight:500}
.cal-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.cal-head button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px}
.cal-head button:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal button{border:0;background:none;aspect-ratio:1;border-radius:9px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;max-width:100%}
.cal button:hover:not(:disabled){background:var(--sunk)}
.cal button.booked{color:var(--muted);text-decoration:line-through;opacity:.55;cursor:not-allowed}
.cal button.past{color:var(--muted);opacity:.35;cursor:default}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.ctl{display:grid;gap:6px}
.ctl label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.ctl label span{font-weight:600;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.addons{display:grid;gap:6px}
.addon{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer}
.addon input{accent-color:var(--accent);width:16px;height:16px}
.addon .p{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.addon:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.lines{display:grid;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{font-weight:800;font-size:16.5px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.lines .note{font-size:12.5px;color:var(--muted)}
.cta{border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15.5px;padding:14px}
.cta:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.done{display:grid;gap:10px;text-align:center;padding:12px 4px}
.done .tick{width:54px;height:54px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-size:26px;margin:0 auto}
.done h3{font-size:24px}
.ref{font-family:var(--f-mono);background:var(--sunk);border-radius:8px;padding:6px 10px;justify-self:center}

/* Host dashboard */
.dash{padding-block:32px 60px;display:grid;gap:22px}
.dash-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.dash-head h1{font-size:clamp(30px,4.4vw,46px);line-height:1.05}
.dash-head p{margin:6px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:18px 20px;border-right:1px solid var(--line);display:grid;gap:4px}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12.5px;font-weight:700}
.up{color:var(--good)} .attn{color:var(--warn)}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h2{font-size:22px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.key{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.enq{display:grid;gap:10px}
.enq-item{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.enq-item .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.enq-item .t b{font-size:15px}
.enq-item .s{font-size:13px;color:var(--muted)}
.enq-item .acts{display:flex;gap:8px}
.enq-item .acts button{flex:1;padding:8px;font-size:13px}

function miles(a,b,c,d){const r=x=>x*Math.PI/180,R=3958.8,dl=r(c-a),dg=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- Find view ---------- */
function filtered(){
  let list = VENUES.filter(v=>{
    if(state.event!=="All events" && !v.suits.includes(state.event)) return false;
    const g=parseInt(state.guests,10); if(g && Math.max(v.seated,v.standing)<g) return false;
    if(state.region!=="Anywhere" && v.region!==state.region) return false;
    if(state.q){const q=state.q.toLowerCase(); if(!(v.name+v.place+v.kind).toLowerCase().includes(q)) return false;}
    const sd=searchDay(); if(sd && bookedDay(v,sd)) return false;
    return true;
  });
  list.forEach(v=>{v.dist=state.near?miles(state.near.lat,state.near.lng,v.lat,v.lng):null;});
  if(state.near) list=list.filter(v=>v.dist<=state.radius);
  if(state.sort==="distance"&&state.near) list.sort((a,b)=>a.dist-b.dist);
  if(state.sort==="price") list.sort((a,b)=>a.hour-b.hour);
  if(state.sort==="capacity") list.sort((a,b)=>b.standing-a.standing);
  if(state.sort==="rating") list.sort((a,b)=>b.rating-a.rating||b.reviews-a.reviews);
  return list;
}

function locateMe(sel){

      p=>{setNear({name:"you",lat:p.coords.latitude,lng:p.coords.longitude});toast("Showing venues near you");},
      ()=>{back();toast("We couldn't get your location. Pick a town instead.");},

}

let lmap=null, lpins=null, lnear=null; const pinById={};
function ensureMap(){
  const el=document.getElementById("map"); if(!el) return null;
  if(lmap&&lmap.getContainer()===el) return lmap;
  if(lmap){try{lmap.remove();}catch(e){} lmap=null;}
  if(!window.L){el.innerHTML='<div class="empty" style="margin:16px">The map could not load. Check your connection and refresh.</div>';return null;}
  lmap=L.map(el,{scrollWheelZoom:false,zoomSnap:0.5,minZoom:5,maxZoom:16,attributionControl:true});
  lmap.attributionControl.setPrefix(false);
  lmap.createPane("land"); lmap.getPane("land").style.zIndex=150;
  L.polygon(GB,{pane:"land",className:"gb-land",interactive:false}).addTo(lmap);
  const tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
  const labels=L.layerGroup(TOWNS.map(t=>L.marker([t.lat,t.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:"town-wrap",html:`<span class="town">${t.name}</span>`,iconSize:[0,0]})})));
  let fails=0; tiles.on("tileerror",()=>{if(++fails>=3&&lmap&&lmap.hasLayer(tiles)){lmap.removeLayer(tiles);labels.addTo(lmap);}});
  tiles.addTo(lmap);
  lnear=L.layerGroup().addTo(lmap); lpins=L.layerGroup().addTo(lmap);
  lmap.setView([53.0,-1.6],6);
  return lmap;
}
function popHTML(v){

}
function lightPin(id,on){
  document.querySelectorAll(".vpin").forEach(p=>p.classList.toggle("on",on&&p.dataset.id===id));
  document.querySelectorAll(".mrow").forEach(r=>r.classList.toggle("on",on&&r.dataset.id===id));
}
function drawMap(list,empty){
  const side=document.getElementById("maplist");
  side.innerHTML=list.length?list.map(v=>`<button type="button" class="mrow" data-id="${v.id}" aria-label="View ${v.name}">
      <div class="mthumb">${scene(v,"m")}</div>
      <div class="minfo"><b>${v.name}</b><span>${v.kind} · ${v.place.split(",").pop().trim()}</span><span class="mp"><strong>${gbp(full(v.hour))}</strong>/hour · ★ ${v.rating.toFixed(1)}</span></div>
      ${v.dist!=null?`<span class="mdist">${milesText(v.dist)}</span>`:""}</button>`).join(""):empty;
  side.querySelectorAll(".mrow").forEach(r=>{
    r.addEventListener("click",()=>openVenue(r.dataset.id));
    r.addEventListener("mouseenter",()=>lightPin(r.dataset.id,true));
    r.addEventListener("mouseleave",()=>lightPin(r.dataset.id,false));
    r.addEventListener("focus",()=>lightPin(r.dataset.id,true));
  });
  const m=ensureMap(); if(!m) return;
  m.invalidateSize();
  lpins.clearLayers(); lnear.clearLayers();
  list.forEach(v=>{
    const mk=L.marker([v.lat,v.lng],{title:v.name,riseOnHover:true,icon:L.divIcon({className:"vpin-wrap",html:`<span class="vpin" data-id="${v.id}">${gbp(full(v.hour))}</span>`,iconSize:[0,0],iconAnchor:[0,0],popupAnchor:[0,-40]})});
    mk.bindPopup(popHTML(v),{maxWidth:260});
    mk.on("click",()=>lightPin(v.id,true));
    mk.on("popupclose",()=>lightPin(v.id,false));
    pinById[v.id]=mk; lpins.addLayer(mk);
  });
  if(state.near){
    const c=L.circle([state.near.lat,state.near.lng],{radius:state.radius*1609.34,className:"near-circle",interactive:false}).addTo(lnear);
    L.marker([state.near.lat,state.near.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:"you-wrap",html:'<span class="you"></span>',iconSize:[0,0]})}).addTo(lnear);
    m.fitBounds(c.getBounds(),{padding:[24,24]});
  }else if(list.length){
    m.fitBounds(L.latLngBounds(list.map(v=>[v.lat,v.lng])),{padding:[60,60],maxZoom:11});
  }else{
    m.fitBounds([[50.0,-5.7],[55.8,1.8]]);
  }
}

function drawBook(){
  const v=state.open, el=document.getElementById("book");
  if(quote.sent){
    el.innerHTML=`<div class="done"><div class="tick">✓</div><h3>${v.instant?"Booking confirmed":"Request sent"}</h3>
      <p style="margin:0;color:var(--muted)">${quote.date.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})} · ${quote.hours} hours · ${quote.guests} guests</p>

      <p style="margin:0">${v.instant?`${v.host} has your booking. Your deposit secures the date.`:`${v.host} will reply soon. ${v.reply}.`}</p>
      <p class="small">Demo only. Nothing was sent or charged.</p>
      <button class="btn" id="again">Plan another event</button></div>`;
    document.getElementById("again").addEventListener("click",()=>{quote.sent=null;quote.date=null;drawBook();});
    return;
  }
  const m=quote.month, first=new Date(m.getFullYear(),m.getMonth(),1), days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const offset=(first.getDay()+6)%7; let cells="";
  for(let i=0;i<offset;i++) cells+="<span></span>";
  for(let d=1;d<=days;d++){
    const dt=new Date(m.getFullYear(),m.getMonth(),d), past=dt<TODAY, booked=!past&&bookedDay(v,dt);
    const sel=quote.date&&dt.getTime()===quote.date.getTime();
    cells+=`<button type="button" data-d="${d}" class="${past?"past":booked?"booked":""}" ${past||booked?"disabled":""} aria-pressed="${!!sel}" aria-label="${d} ${MONTHS_L[m.getMonth()]}${booked?", booked":""}">${d}</button>`;
  }
  const atMin = m.getFullYear()===TODAY.getFullYear() && m.getMonth()===TODAY.getMonth();
  const hire=hireCost(v,quote.hours);
  const add=v.addons.map((a,i)=>quote.addons[i]?(a.head?a.p*quote.guests:a.p):0).reduce((x,y)=>x+y,0);
  const fee=(hire+add)*0.04, total=hire+add+fee, deposit=Math.min(250,Math.round(v.day*0.25/10)*10||100);
  const maxG=Math.max(v.seated,v.standing);
  el.innerHTML=`
    <div class="from"><span><b class="num">${gbp(full(v.hour))}</b> / hour</span><span style="font-size:13px;color:var(--muted)">Day rate ${gbp(full(v.day))}</span></div>
    <p class="small" style="text-align:left;margin-top:-10px">Prices include Vendo's 4% booking fee. No other charges.</p>
    <div>
      <div class="cal-head"><button type="button" id="prev" aria-label="Previous month" ${atMin?"disabled":""}>‹</button><span>${MONTHS_L[m.getMonth()]} ${m.getFullYear()}</span><button type="button" id="next" aria-label="Next month">›</button></div>
      <div class="cal" style="margin-top:8px">${["M","T","W","T","F","S","S"].map(d=>`<span class="dow">${d}</span>`).join("")}${cells}</div>
      <div class="legend" style="margin-top:6px"><span><s>12</s> already booked</span><span>Pick a free date</span></div>
    </div>
    <div class="ctl"><label for="hrs">Hours <span>${quote.hours} hrs${quote.hours>=8?" · day rate":""}</span></label><input id="hrs" type="range" min="${v.minH}" max="12" value="${quote.hours}"></div>
    <div class="ctl"><label for="gst">Guests <span>${quote.guests} of ${maxG} max</span></label><input id="gst" type="range" min="10" max="${maxG}" step="5" value="${quote.guests}"></div>
    <div class="addons">${v.addons.map((a,i)=>`<label class="addon" for="ad${i}"><input type="checkbox" id="ad${i}" data-i="${i}" ${quote.addons[i]?"checked":""}>${a.l}<span class="p">${gbp(a.p)}${a.head?" pp":""}</span></label>`).join("")}</div>
    <div class="lines num">
      <div><span>Venue hire${quote.hours>=8?" (day rate)":` (${quote.hours} × ${gbp(v.hour)})`}</span><span>${gbp(hire)}</span></div>
      ${add?`<div><span>Extras</span><span>${gbp(add)}</span></div>`:""}
      <div><span>Booking fee (4%)</span><span>${gbp(fee)}</span></div>
      <div class="tot"><span>Total</span><span>${gbp(total)}</span></div>
      <div class="note"><span>Refundable damage deposit, held separately</span><span>${gbp(deposit)}</span></div>
    </div>
    <button class="cta" id="req" ${quote.date?"":"disabled"}>${quote.date?(v.instant?"Book ":"Request ")+quote.date.toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"Choose a date to continue"}</button>
    <p class="small">${v.instant?"Instant book: confirmed straight away.":"You won't be charged until "+v.host.split(",")[0]+" accepts."} Your guest rating, ★ ${guestScore().toFixed(1)}, is shared with the venue.</p>`;
  el.querySelectorAll(".cal button").forEach(b=>b.addEventListener("click",()=>{quote.date=new Date(m.getFullYear(),m.getMonth(),+b.dataset.d);drawBook();}));
  document.getElementById("prev").addEventListener("click",()=>{quote.month=new Date(m.getFullYear(),m.getMonth()-1,1);drawBook();});
  document.getElementById("next").addEventListener("click",()=>{quote.month=new Date(m.getFullYear(),m.getMonth()+1,1);drawBook();});
  const hrs=document.getElementById("hrs"), gst=document.getElementById("gst");
  hrs.addEventListener("input",()=>{quote.hours=+hrs.value;drawBook();document.getElementById("hrs").focus();});
  gst.addEventListener("input",()=>{quote.guests=+gst.value;drawBook();document.getElementById("gst").focus();});
  el.querySelectorAll(".addon input").forEach(c=>c.addEventListener("change",()=>{quote.addons[c.dataset.i]=c.checked;drawBook();}));
  document.getElementById("req").addEventListener("click",()=>{quote.sent="VND-"+(48213+quote.date.getDate()*17+v.id.length);drawBook();});
}

function chartSVG(){
  const W=640,H=250,L=48,R=12,T=28,B=30, max=7000, data=host.revenue, n=data.length, bw=(W-L-R)/n;
  const y=v=>T+(H-T-B)*(1-v/max);
  let g="";
  for(let t=0;t<=max;t+=1750){g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Nunito, sans-serif">£${t/1000}k</text>`}
  const bars=data.map((v,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,after=i>=host.joined;
    return `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="4" fill="${after?"var(--accent)":"var(--muted)"}" opacity="${after?1:.45}"><title>${host.months[i]}: ${gbp(v)}</title></rect>
    <text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${host.months[i]}</text>`}).join("");
  const jx=L+host.joined*bw;
  const before=data.slice(0,host.joined).reduce((a,b)=>a+b,0)/host.joined;
  const last=data[n-1], lx=L+(n-1)*bw+bw/2;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly room hire revenue, December 2025 to November 2026">${g}
    <line x1="${jx}" x2="${jx}" y1="${T-14}" y2="${y(0)}" stroke="var(--ink)" stroke-dasharray="3 3"/>
    <text x="${jx+6}" y="${T-4}" font-size="11.5" font-weight="700" fill="var(--ink)">Listed on Vendo</text>
    <line x1="${L}" x2="${jx}" y1="${y(before)}" y2="${y(before)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6"/>
    ${bars}
    <text x="${lx}" y="${y(last)-8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent-text)" font-family="Nunito, sans-serif">${gbp(last)}</text></svg>`;
}

        </ul></div>

        <div>${ME.bookings.map(b=>`<div class="brow"><b>${b.event}</b><span class="pill ${b.status==="Confirmed"?"ok":"new"}">${b.status}</span>
          <span>${b.venue} · ${b.date} · ${b.guests} guests</span><button class="linkbtn" data-open="${b.id}">View venue</button></div>`).join("")}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h2>What venue owners say about you</h2><span class="eyebrow">${n} reviews</span></div>
      <div class="revs">${ME.reviews.map((r,i)=>`<div class="rev"><div class="t"><b>${r.venue}</b>${starsHTML(r.stars)}</div>
        <span class="s">${r.event} · ${r.date}</span><p>${r.text}</p>${tagHTML(r.tags)}<span class="by">${r.host}</span>
        <button class="linkbtn" data-reply="${i}">Reply publicly</button></div>`).join("")}</div></div>
  </section>`;
  document.getElementById("edit-profile").addEventListener("click",()=>toast("Demo: this would open your profile settings"));
  document.getElementById("sign-out").addEventListener("click",()=>toast("Demo: you'd be signed out here"));
  app.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openVenue(b.dataset.open)));
  app.querySelectorAll("[data-reply]").forEach(b=>b.addEventListener("click",()=>toast(`Demo: reply to ${ME.reviews[b.dataset.reply].host.split(",")[0]}`)));
}

function enqRating(q){
  if(q.gr==="me"){const sc=guestScore();return `<div class="grate">${starsHTML(sc)}<b>${sc.toFixed(1)}</b> guest rating · ${ME.reviews.length} events · ${tagCounts().slice(0,2).map(t=>t[0]).join(" · ")}</div>`;}
  if(q.gr==null) return `<div class="grate"><span class="newg">New to Vendo</span> · ID checked · no ratings yet</div>`;
  return `<div class="grate">${starsHTML(q.gr)}<b>${q.gr.toFixed(1)}</b> guest rating · ${q.gc} ${q.gc===1?"event":"events"} · ${q.gt.join(" · ")}</div>`;
}
function drawRate(){
  const el=document.getElementById("rate"); if(!el) return;
  const left=host.toRate.filter(r=>!r.rated).length;
  document.getElementById("rate-count").textContent=left?`${left} to rate`:"All rated";
  el.innerHTML=host.toRate.map(r=>{
    if(r.rated) return `<div class="rate-item"><div class="t"><b>${r.n}</b><span>${r.e} · ${r.d} · ${r.g} guests</span></div>
      <div class="rated-sum">${starsHTML(r.rated.stars)}<span class="pill ok">Rated</span>${r.rated.text?`<span style="color:var(--muted)">“${r.rated.text}”</span>`:""}</div>${r.rated.tags.length?tagHTML(r.rated.tags):""}</div>`;
    const d=host.draft[r.id]||(host.draft[r.id]={stars:0,tags:[],text:""});
    const tags=[...GOOD_TAGS,...(d.stars&&d.stars<=3?BAD_TAGS:[])];
    return `<div class="rate-item" data-id="${r.id}"><div class="t"><b>${r.n}</b><span>${r.e} · ${r.d} · ${r.g} guests</span></div>
      <div class="starpick" role="group" aria-label="Rate ${r.n}">${[1,2,3,4,5].map(k=>`<button type="button" data-star="${k}" class="${k<=d.stars?"on":""}" aria-label="${k} star${k>1?"s":""}" aria-pressed="${k===d.stars}">★</button>`).join("")}</div>
      <div class="tagpick" role="group" aria-label="What went well">${tags.map(t=>`<button type="button" data-tag="${t}" class="${BAD_TAGS.includes(t)?"bad":""}" aria-pressed="${d.tags.includes(t)}">${t}</button>`).join("")}</div>
      <textarea id="rc-${r.id}" placeholder="Anything other venues should know? (optional)">${d.text}</textarea>
      <div class="acts"><button type="button" class="btn primary" data-submit ${d.stars?"":"disabled"}>Submit rating</button><span class="note">${r.n.split(" ")[0]} sees it once they've reviewed you, or in 14 days.</span></div></div>`;
  }).join("");
  el.querySelectorAll(".rate-item[data-id]").forEach(item=>{
    const r=host.toRate.find(x=>x.id===item.dataset.id), d=host.draft[r.id];
    item.querySelector("textarea").addEventListener("input",e=>{d.text=e.target.value;});
    item.querySelectorAll("[data-star]").forEach(b=>b.addEventListener("click",()=>{d.stars=+b.dataset.star; if(d.stars>3) d.tags=d.tags.filter(t=>!BAD_TAGS.includes(t)); drawRate();}));
    item.querySelectorAll("[data-tag]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.tag; d.tags=d.tags.includes(t)?d.tags.filter(x=>x!==t):[...d.tags,t]; drawRate();}));
    item.querySelector("[data-submit]").addEventListener("click",()=>{if(!d.stars)return; r.rated={stars:d.stars,tags:d.tags.slice(),text:d.text.trim()}; toast(`Rating saved for ${r.n}.`); drawRate();});
  });
}
/* ---------- List your venue ---------- */
const lyv={sent:false, f:{name:"",type:"Pub or bar",town:"",contact:"",email:"",phone:"",cap:"",note:""}};
function renderList(){
  app.innerHTML=`<section class="wrap lyv">
    <div class="lyv-hero">
      <div class="eyebrow">For pubs, bars, nightclubs, halls and clubs</div>
      <h1>Turn your empty room into <em>steady income.</em></h1>
      <p>List your function room, hall or bar on Vendo for free. We set up your listing, send you bookings, and take 8% only when a booking is paid.</p>
      <div class="lyv-cta"><a class="btn primary" href="#lyv-form">List your venue free</a><a class="btn" href="#lyv-earn">See what you could earn</a></div>
    </div>
    <div class="steps">
      <div class="step"><span class="n">1</span><h3>Tell us about your space</h3><p>Fill in the short form below. We'll call within two working days.</p></div>
      <div class="step"><span class="n">2</span><h3>We build your listing</h3><p>A Vendo team member takes photos, sets prices and loads your calendar. You approve it.</p></div>
      <div class="step"><span class="n">3</span><h3>Bookings come to you</h3><p>Accept requests from your phone. Payments and deposits land in your bank automatically.</p></div>
    </div>
    <div class="perks">
      <div><b>Free to list</b><span>No sign-up or monthly fee.</span></div>
      <div><b>8% only when booked</b><span>Founding venues pay 5% for life.</span></div>
      <div><b>Rated guests</b><span>See every guest's rating before you say yes.</span></div>
      <div><b>Your rules</b><span>Set your own prices, hours and house rules.</span></div>
    </div>
    <div class="panel" id="lyv-earn"><div class="panel-head"><h2>What could your space earn?</h2><span class="eyebrow">Estimator</span></div>
      <div class="est">
        <div style="display:grid;gap:16px">
          <div class="ctl"><label for="et">Type of space</label><select id="et">${Object.entries(EST_TYPES).map(([k,[l]])=>`<option value="${k}" ${k===host.est.type?"selected":""}>${l}</option>`).join("")}</select></div>
          <div class="ctl"><label for="ep">Bookings per month <span id="ep-v">${host.est.per}</span></label><input id="ep" type="range" min="1" max="20" value="${host.est.per}"></div>
          <div class="ctl"><label for="er">Average hire fee <span id="er-v">${gbp(host.est.rate)}</span></label><input id="er" type="range" min="100" max="3000" step="50" value="${host.est.rate}"></div>
          <div class="ctl"><label for="eg">Average guests <span id="eg-v">${host.est.guests}</span></label><input id="eg" type="range" min="10" max="250" step="5" value="${host.est.guests}"></div>
        </div>
        <div class="est-out" aria-live="polite"><span class="eyebrow">Extra income per year</span><span class="big" id="e-total"></span>
          <div class="split"><div>Room hire, after 8% fee<b class="num" id="e-hire"></b></div><div>Bar & food spend<b class="num" id="e-bar"></b></div></div>
          <span style="font-size:12.5px;color:var(--muted)">An estimate based on the numbers you choose. Your real results will vary.</span></div>
      </div></div>
    <div class="lyv-grid">
      <div class="panel" id="lyv-form"></div>
      <div class="panel"><div class="panel-head"><h2>Questions venues ask</h2></div>
        <div class="faq">
          <details><summary>Do I have to take every booking?</summary><p>No. You accept or decline each request, or turn on instant book for dates you're happy to fill.</p></details>
          <details><summary>When do I get paid?</summary><p>The guest pays when you accept. The money reaches your bank account after the event, minus our fee.</p></details>
          <details><summary>What about damage?</summary><p>Guests pay a refundable damage deposit, agree to your house rules, and carry a guest rating from other venues.</p></details>
          <details><summary>Can I still take bookings by phone?</summary><p>Yes. Add them to your Vendo calendar so you never double book.</p></details>
          <details><summary>Do I need a licence?</summary><p>Only for what you already do, such as selling alcohol or late music. We'll ask for your licence details when we set up your listing.</p></details>
        </div></div>
    </div>
  </section>`;
  drawEst();
  ["et","ep","er","eg"].forEach(id=>document.getElementById(id).addEventListener("input",e=>{
    if(id==="et"){host.est.type=e.target.value;const t=EST_TYPES[host.est.type];host.est.rate=t[1];document.getElementById("er").value=t[1];}
    host.est.per=+document.getElementById("ep").value;host.est.rate=+document.getElementById("er").value;host.est.guests=+document.getElementById("eg").value;drawEst();}));
  app.querySelectorAll('a[href^="#lyv-"]').forEach(a=>a.addEventListener("click",e=>{e.preventDefault();document.getElementById(a.getAttribute("href").slice(1)).scrollIntoView({behavior:"smooth",block:"start"});}));

function drawLyvForm(){
  const el=document.getElementById("lyv-form"), f=lyv.f;
  if(lyv.sent){
    el.innerHTML=`<div class="done"><div class="tick">✓</div><h3>Thanks, ${f.contact.split(" ")[0]}.</h3>
      <p style="margin:0">We've got the details for <b>${f.name}</b>. A Vendo team member will call you within two working days to set up your listing.</p>
      <p class="small">Demo only. Nothing was sent.</p><button class="btn" id="lyv-again" type="button">Add another venue</button></div>`;
    document.getElementById("lyv-again").addEventListener("click",()=>{lyv.sent=false;lyv.f={name:"",type:"Pub or bar",town:"",contact:"",email:"",phone:"",cap:"",note:""};drawLyvForm();});
    return;
  }
  const types=["Pub or bar","Nightclub","Village or community hall","Sports or social club","Leisure centre","Restaurant","Barn or outdoor space","Other"];
  el.innerHTML=`<div class="panel-head"><h2>List your venue</h2><span class="eyebrow">Takes 2 minutes</span></div>
    <form class="lform" id="lform" novalidate>
      <div class="lf full"><label for="lf-name">Venue name</label><input id="lf-name" value="${f.name}" autocomplete="organization" placeholder="The Red Lion"><span class="err" id="e-name"></span></div>
      <div class="lf"><label for="lf-type">Type of venue</label><select id="lf-type">${types.map(t=>`<option ${t===f.type?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="lf"><label for="lf-town">Town or village</label><input id="lf-town" value="${f.town}" placeholder="Stow-on-the-Wold"><span class="err" id="e-town"></span></div>
      <div class="lf"><label for="lf-contact">Your name</label><input id="lf-contact" value="${f.contact}" autocomplete="name"><span class="err" id="e-contact"></span></div>
      <div class="lf"><label for="lf-cap">Guests your room holds</label><input id="lf-cap" type="number" min="1" inputmode="numeric" value="${f.cap}" placeholder="80"></div>
      <div class="lf"><label for="lf-email">Email</label><input id="lf-email" type="email" value="${f.email}" autocomplete="email"><span class="err" id="e-email"></span></div>
      <div class="lf"><label for="lf-phone">Phone</label><input id="lf-phone" type="tel" value="${f.phone}" autocomplete="tel"><span class="err" id="e-phone"></span></div>
      <div class="lf full"><label for="lf-note">Anything else? (optional)</label><textarea id="lf-note" placeholder="Rooms, opening times, events you already host">${f.note}</textarea></div>
      <div class="lf full"><button class="cta" type="submit">Send my details</button><p class="small" style="text-align:left">We'll only use these details to set up your listing.</p></div>
    </form>`;
  const form=document.getElementById("lform");
  const keys={name:"lf-name",type:"lf-type",town:"lf-town",contact:"lf-contact",email:"lf-email",phone:"lf-phone",cap:"lf-cap",note:"lf-note"};
  Object.entries(keys).forEach(([k,id])=>document.getElementById(id).addEventListener("input",e=>{f[k]=e.target.value;const er=document.getElementById("e-"+k);if(er) er.textContent="";}));
  form.addEventListener("submit",e=>{
    e.preventDefault();
    const errs={};
    if(!f.name.trim()) errs.name="Enter your venue's name.";
    if(!f.town.trim()) errs.town="Enter the town or village.";
    if(!f.contact.trim()) errs.contact="Enter your name.";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) errs.email="Enter an email address like name@yourpub.co.uk.";
    if(f.phone.replace(/\D/g,"").length<10) errs.phone="Enter a phone number with at least 10 digits.";
    ["name","town","contact","email","phone"].forEach(k=>{document.getElementById("e-"+k).textContent=errs[k]||"";});
    const first=Object.keys(errs)[0];
    if(first){document.getElementById(keys[first]).focus();return;}
    lyv.sent=true; drawLyvForm(); document.getElementById("lyv-form").scrollIntoView({block:"start",behavior:"smooth"});
  });
}
let tt; function toast(msg,ms){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ms||2800);}

/* ---------- Routing ---------- */
function route(){
  const h=location.hash;
  if(h.startsWith("#venue-")){
    const id=h.slice(7);
    if(VENUES.some(x=>x.id===id)){
      if(state.open&&state.open.id===id) return;
      if(state.open) closeVenue(true);
      if(state.view!=="find"||!document.getElementById("grid")){state.view="find";renderFind();}
      ["tab-find","tab-host","tab-me"].forEach(t=>document.getElementById(t).setAttribute("aria-pressed",t==="tab-find"));
      openVenue(id,true); return;
    }
  }
  const v=h==="#host"?"host":h==="#account"?"account":h==="#list-your-venue"?"list":"find"; state.view=v;
  document.getElementById("tab-find").setAttribute("aria-pressed",v==="find");
  document.getElementById("tab-host").setAttribute("aria-pressed",v==="host");
  document.getElementById("tab-me").setAttribute("aria-pressed",v==="account");
  if(state.open) closeVenue(true);
  v==="host"?renderHost():v==="account"?renderAccount():v==="list"?(renderList(),window.scrollTo(0,0)):renderFind();
}
document.getElementById("tab-find").addEventListener("click",()=>{location.hash="find";route();window.scrollTo(0,0)});
document.getElementById("tab-host").addEventListener("click",()=>{location.hash="host";route();window.scrollTo(0,0)});
document.getElementById("tab-me").addEventListener("click",()=>{location.hash="account";route();window.scrollTo(0,0)});
window.addEventListener("hashchange",route);
route();
</script>
